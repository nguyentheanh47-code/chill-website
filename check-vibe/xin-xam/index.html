<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xin Xăm Vũ Trụ — Check Vibe Vũ Trụ | Chill Entertainment</title>
<meta name="description" content="Lắc xăm nhận số may mắn 1-100, xem luận giải từ Vũ Trụ và bản dịch Gen Z từ Mr. Chill.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/check-vibe/vibe.css">
<link rel="canonical" href="https://chillentertainment.vn/check-vibe/xin-xam/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Chill Entertainment">
<meta property="og:title" content="Xin Xăm Vũ Trụ — Check Vibe Vũ Trụ | Chill Entertainment">
<meta property="og:description" content="Lắc xăm nhận số may mắn 1-100, xem luận giải từ Vũ Trụ và bản dịch Gen Z từ Mr. Chill.">
<meta property="og:image" content="https://chillentertainment.vn/check-vibe/og/og-xin-xam.jpg">
<meta property="og:url" content="https://chillentertainment.vn/check-vibe/xin-xam/">
<meta name="twitter:card" content="summary_large_image">
</head>
<body class="vibe-body">

<div class="vibe-stars"></div>
<div class="vibe-nebula"></div>

<header class="vibe-header">
  <div class="wrap vibe-header-inner">
    <a href="/check-vibe/" class="vibe-back">← Check Vibe Vũ Trụ</a>
    <a href="/" class="vibe-logo"><img src="/images/logo-white.png" alt="Chill Entertainment"></a>
  </div>
</header>

<div class="xam-wrap">
  <div class="vibe-eyebrow">🎴 Xin Xăm Vũ Trụ</div>
  <h1 style="font-size:clamp(28px,5vw,40px); font-weight:900; margin-bottom:12px;">Lắc 1 lá, biết vận hôm nay</h1>
  <p class="xam-hint">Nhắm mắt 3 giây, nghĩ về điều bạn đang thắc mắc, rồi bấm vào lọ xăm</p>

  <div class="xam-jar" id="xamJar">🎋</div>

  <div class="xam-number" id="xamNumber"></div>

  <button class="xam-btn" id="xamRevealBtn" style="display:none;">Xem luận giải</button>

  <div class="xam-result" id="xamResult">
    <span class="xam-bac" id="xamBac"></span>
    <p>🌌 <b>Luận giải từ Vũ Trụ:</b> <span id="xamVutru"></span></p>
    <p class="xam-genz">✨ <b>Mr. Chill giải:</b> <span id="xamChill"></span></p>
    <div class="share-btn-row">
      <button class="share-btn" id="xamShareBtn">📤 Chia sẻ nhanh</button>
      <button class="share-btn" id="xamDownloadBtn">🖼️ Tải ảnh đẹp</button>
    </div>
    <a href="#" class="xam-again" id="xamAgain">↺ Lắc lá khác</a>
  </div>
</div>

<footer class="vibe-footer">
  <div class="wrap">
    <p>Một sản phẩm giải trí từ <a href="/">Chill Entertainment</a> — Học viện đào tạo Idol Livestream</p>
  </div>
</footer>

<script src="/check-vibe/share-card.js"></script>
<script src="/check-vibe/xam-data.js"></script>
<script>
(function(){
  var jar = document.getElementById('xamJar');
  var numberEl = document.getElementById('xamNumber');
  var revealBtn = document.getElementById('xamRevealBtn');
  var resultEl = document.getElementById('xamResult');
  var bacEl = document.getElementById('xamBac');
  var vutruEl = document.getElementById('xamVutru');
  var chillEl = document.getElementById('xamChill');
  var againLink = document.getElementById('xamAgain');
  var used = false;

  function resetState(){
    used = false;
    numberEl.classList.remove('show');
    numberEl.textContent = '';
    revealBtn.style.display = 'none';
    resultEl.classList.remove('show');
    jar.style.pointerEvents = 'auto';
    jar.textContent = '🎋';
  }

  jar.addEventListener('click', function(){
    if (used) return;
    used = true;
    jar.classList.add('shaking');
    jar.style.pointerEvents = 'none';

    setTimeout(function(){
      jar.classList.remove('shaking');
      jar.textContent = '✨';
      var so = Math.floor(Math.random() * 100) + 1;
      numberEl.textContent = 'Lá số ' + so;
      numberEl.classList.add('show');
      numberEl.dataset.so = so;
      revealBtn.style.display = 'inline-block';
    }, 900);
  });

  revealBtn.addEventListener('click', function(){
    var so = parseInt(numberEl.dataset.so, 10);
    var data = XAM_DATA.filter(function(x){ return x.so === so; })[0];
    if (!data) return;
    bacEl.textContent = data.bac;
    vutruEl.textContent = data.vutru;
    chillEl.textContent = data.chill;
    resultEl.classList.add('show');
    revealBtn.style.display = 'none';

    var shareBtn = document.getElementById('xamShareBtn');
    var downloadBtn = document.getElementById('xamDownloadBtn');
    var caption = 'Lá số ' + so + ' — ' + data.bac + ' 🎋 ' + data.chill;
    var url = 'https://chillentertainment.vn/check-vibe/xin-xam/';

    shareBtn.onclick = function(){
      shareQuickCard({
        icon: '🎋',
        eyebrow: data.bac,
        title: 'Lá số ' + so,
        body: data.chill
      }, caption, url, shareBtn, 'xin-xam-la-so-' + so + '.png');
    };

    downloadBtn.onclick = function(){
      downloadBtn.textContent = '⏳ Đang tạo ảnh...';
      generateShareCard({
        icon: '🎋',
        eyebrow: data.bac,
        title: 'Lá số ' + so,
        body: data.chill
      }, function(blob){
        downloadBtn.textContent = '🖼️ Tải ảnh đẹp';
        downloadCardImage(blob, 'xin-xam-la-so-' + so + '.png', downloadBtn);
      });
    };
  });

  againLink.addEventListener('click', function(e){
    e.preventDefault();
    resetState();
  });
})();
</script>

</body>
</html>
